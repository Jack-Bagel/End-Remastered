plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.16-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false

    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

publishMods {
    changelog = "- Fixed duplicate registry crash with newest neoforge version"
    type = STABLE
    modLoaders.add("fabric")
    displayName = "${mod_name} R${project.properties["version"]} [Fabric]"

    // CurseForge options used by both Fabric and NeoForge
    def cfOptions = curseforgeOptions {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "${curseforge_project_id}"
        minecraftVersionRange {
            start = "${minecraft_version}"
            end = "${minecraft_version_end}"
        }
        clientRequired = true
        serverRequired = true
    }

    // Modrinth options used by both Fabric and NeoForge
    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        projectId = "${modrinth_project_id}"
        minecraftVersionRange {
            start = "${minecraft_version}"
            end = "${minecraft_version_end}"
        }
    }

    // Fabric CurseForge
//    curseforge("curseforgeFabric") {
//        from cfOptions
//        file project(":fabric")
//        modLoaders.add("fabric")
//        requires("fabric-api")
//    }

    // NeoForge CurseForge
    curseforge("curseforgeNeoForge") {
        from cfOptions
        file project(":neoforge")
        modLoaders.add("neoforge")
    }

    // Fabric Modrinth
//    modrinth("modrinthFabric") {
//        from mrOptions
//        file project(":fabric")
//        modLoaders.add("fabric")
//        requires("fabric-api")
//    }

    // NeoForge Modrinth
    modrinth("modrinthNeoForge") {
        from mrOptions
        file project(":neoforge")
        modLoaders.add("neoforge")
    }
}